<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday & A/L Good Luck! 💖</title>
    <!-- Importing cute fonts from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* CSS: The Styling and Animations */
        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            /* Dynamic animated gradient background */
            background: linear-gradient(-45deg, #ffdde1, #ee9ca7, #fad0c4, #ffd6e0);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; 
            text-align: center;
            overflow-x: hidden;
            padding: 20px;
            position: relative;
            transition: background 1s ease; 
        }

        /* EXAM MODE: Dark, energetic neon theme */
        body.exam-mode {
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #000000);
            background-size: 400% 400%;
            animation: examGradientBG 5s ease infinite; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes examGradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* The Card Containers */
        .container {
            background: rgba(255, 255, 255, 0.65);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(255, 105, 135, 0.3);
            max-width: 500px;
            width: 90%;
            -webkit-backdrop-filter: blur(15px); /* iOS optimization */
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.6);
            transform: translateZ(0); /* Forces GPU rendering */
            transition: all 0.5s ease; 
            z-index: 10;
        }

        body.exam-mode .container {
            background: rgba(15, 15, 20, 0.85);
            border: 2px solid #00ffcc;
            box-shadow: 0 10px 50px rgba(0, 255, 204, 0.4);
            color: #ffffff;
        }

        #page-one { animation: pop 1.2s ease-out; }

        @keyframes pop { 
            0% { transform: scale(0.7) translateZ(0); opacity: 0; } 
            100% { transform: scale(1) translateZ(0); opacity: 1; } 
        }

        /* Glowing Text Effect */
        h1 {
            font-family: 'Bubblegum Sans', cursive;
            font-size: clamp(2rem, 8vw, 3.2rem); 
            background: linear-gradient(90deg, #c9184a, #ff4d6d, #ff8fa3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            will-change: filter, text-shadow; /* Prevents text animation lag */
            animation: glow 2s ease-in-out infinite alternate;
        }

        body.exam-mode h1 {
            background: linear-gradient(90deg, #ff3366, #ff9933, #ffcc00);
            -webkit-background-clip: text;
            text-shadow: 0 0 15px rgba(255, 153, 51, 0.6);
            animation: examGlow 1s ease-in-out infinite alternate;
        }

        @keyframes glow { 
            from { text-shadow:0 0 10px rgba(255, 77, 109, 0.5); } 
            to { text-shadow:0 0 25px rgba(255, 143, 163, 0.8); } 
        }

        @keyframes examGlow { 
            from { text-shadow:0 0 10px rgba(255, 51, 102, 0.6); } 
            to { text-shadow:0 0 30px rgba(255, 204, 0, 0.9); } 
        }

        /* Floating Interactive Elements */
        .cake, .floating-emoji {
            font-size: clamp(50px, 15vw, 80px);
            cursor: pointer;
            animation: float 3s ease-in-out infinite;
            margin: 15px 0;
            display: inline-block;
            transition: transform 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent; 
            will-change: transform;
        }

        .cake:active { transform: scale(0.9); }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .hint {
            color: #c9184a;
            font-size: clamp(0.9rem, 3vw, 1rem);
            font-weight: 800;
            margin-top: -10px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Message Box & Polaroid */
        #message-box {
            display: none;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        .polaroid {
            background: white;
            padding: 8px 8px 20px 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transform: rotate(-3deg) translateZ(0);
            margin: 15px auto;
            max-width: 200px;
            width: 50%;
            min-width: 140px;
            border-radius: 4px;
        }

        .polaroid img {
            width: 100%;
            height: auto;
            border-radius: 3px;
        }

        p {
            color: #4a0014;
            line-height: 1.6;
            font-size: 1.15rem;
            font-weight: 700;
            margin-top: 15px;
            transition: color 0.5s;
        }

        #msg { min-height: 100px; }

        .signature {
            color: #ff5e7e;
            font-weight: normal;
            font-size: 1.6rem;
            font-family: 'Bubblegum Sans', cursive;
            margin-top: 10px;
            display: none;
            animation: pop 0.5s ease-out;
        }

        .btn {
            background: linear-gradient(90deg, #c9184a, #ff4d6d);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 1rem;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
            display: none; 
            animation: pop 0.5s ease-out;
            will-change: transform;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 77, 109, 0.5);
        }

        .btn:active { transform: scale(0.95); }

        #page-two, #page-three {
            display: none;
            opacity: 0;
            position: absolute; 
        }

        .big-text {
            font-size: clamp(1.2rem, 5vw, 1.5rem);
            font-weight: 800;
            color: #c9184a;
            margin-top: 20px;
        }

        body.exam-mode .big-text { color: #e0e0e0; }
        body.exam-mode .floating-emoji { animation: floatExam 2s ease-in-out infinite; }

        @keyframes floatExam {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }

        /* Particle System Optimization */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .petal, .exam-drop, .glitter {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            /* CRITICAL: Hardware acceleration for all floating items */
            will-change: transform, opacity;
        }
        
        .exam-drop {
            font-family: 'Bubblegum Sans', cursive;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .glitter {
            width: 6px; height: 6px;
            background: radial-gradient(circle, #fff, #ffd700, #ff69b4);
            border-radius: 50%;
            box-shadow: 0 0 8px #fff;
        }

        @keyframes burstUp {
            0% { transform: translate3d(0,0,0) rotate(0deg); opacity: 1; }
            100% { transform: translate3d(var(--tx), var(--ty), 0) rotate(720deg); opacity: 0; }
        }

        @keyframes dropDown {
            0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 1; }
            100% { transform: translate3d(0, 110vh, 0) rotate(360deg); opacity: 0; }
        }

        /* Media Queries */
        @media (max-width: 600px) {
            .container { padding: 30px 20px; }
            #msg { min-height: 140px; }
        }

        @media (max-width: 400px) {
            .container { padding: 25px 15px; }
            p { font-size: 1.05rem; }
            .signature { font-size: 1.4rem; }
            .btn { padding: 10px 24px; font-size: 0.95rem; }
            #msg { min-height: 180px; }
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="container" id="page-one">
        <h1>Happy Birthday Bestie! 🌹</h1>
        <div class="cake" id="cakeBtn">🎂</div>
        <div class="hint">Tap the cake!</div>

        <div id="message-box">
            <div class="polaroid">
                <!-- Replace with your own cute pic link! -->
                <img src="https://images.unsplash.com/photo-1517457373958-b7bdd4587205?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" alt="Us!">
            </div>
            <p id="msg"></p>
            <div class="signature" id="signature">Besties forever, [Your Name] ✨</div>
            <button class="btn" id="thankBtn">Thank You 💖</button>
        </div>
    </div>

    <div class="container" id="page-two">
        <h1>Reality Check... 🛑</h1>
        <p class="big-text">Birthday magic paused...<br>Back to the A/L grind! 😭📚</p>
    </div>

    <div class="container" id="page-three">
        <h1 style="background: linear-gradient(90deg, #00ffcc, #00bfff); -webkit-background-clip: text;">Smash those A/Ls! 🍀</h1>
        <div class="floating-emoji">☕️🎓✍️</div>
        <p class="big-text">Do your best, forget the rest! You are going to ace this! Future uni student vibes loading... ⚡️</p>
    </div>

    <!-- JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        // Track intervals for clean memory management
        let petalInterval;
        let examDropInterval;

        // BACKGROUND EFFECT 1: Falling Birthday Roses (Optimized)
        function createPetal(){
            let p = document.createElement('div');
            p.className = 'petal';
            p.innerHTML = '🌹';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = '-50px';
            p.style.fontSize = 16 + Math.random() * 14 + 'px';
            p.style.animation = 'burstUp ' + (5 + Math.random() * 5) + 's linear forwards';
            p.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            p.style.setProperty('--ty', '110vh');
            document.body.appendChild(p);
            
            // Clean up DOM node to prevent memory leak
            setTimeout(() => p.remove(), 10000);
        }
        petalInterval = setInterval(createPetal, 700);

        // BACKGROUND EFFECT 2: Falling Exam Hype
        function createExamDrop(){
            const items = ['A', '☕️', '📚', '📝', '🧠', '⚡️', 'Past Papers', '🎓'];
            let text = items[Math.floor(Math.random() * items.length)];
            let p = document.createElement('div');
            p.className = 'exam-drop';
            p.innerHTML = text;
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = '-50px';
            p.style.fontSize = 20 + Math.random() * 20 + 'px';
            p.style.animation = 'dropDown ' + (3 + Math.random() * 3) + 's linear forwards';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 7000);
        }

        // CORNER BURST EFFECT (Optimized: Reduced loop count and staggered insertion)
        function cornerBurst(){
            const corners = [{x: '5vw', y: '95vh'}, {x: '95vw', y: '95vh'}];
            const isMobile = window.innerWidth < 600;
            // Reduced to 12 items per corner for massive performance gain
            const burstCount = 12; 

            corners.forEach((corner, index) => {
                for(let j = 0; j < burstCount; j++){
                    setTimeout(() => {
                        let p = document.createElement('div');
                        p.className = 'petal';
                        p.innerHTML = '🌹';
                        p.style.left = corner.x;
                        p.style.top = corner.y;
                        p.style.fontSize = 18 + Math.random() * 12 + 'px';
                        
                        let angle = index === 0 ? -45 : -135;
                        let dist = (isMobile ? 250 : 400) + Math.random() * (isMobile ? 200 : 300);
                        
                        p.style.animation = 'burstUp 3s ease-out forwards';
                        p.style.setProperty('--tx', Math.cos(angle * Math.PI / 180) * dist + 'px');
                        p.style.setProperty('--ty', Math.sin(angle * Math.PI / 180) * dist + 'px');
                        document.body.appendChild(p);
                        setTimeout(() => p.remove(), 3000);

                        let g = document.createElement('div');
                        g.className = 'glitter';
                        g.style.left = corner.x;
                        g.style.top = corner.y;
                        g.style.animation = 'burstUp 2.5s ease-out forwards';
                        g.style.setProperty('--tx', Math.cos(angle * Math.PI / 180) * (dist - 50) + 'px');
                        g.style.setProperty('--ty', Math.sin(angle * Math.PI / 180) * (dist - 50) + 'px');
                        document.body.appendChild(g);
                        setTimeout(() => g.remove(), 2500);

                    }, j * 60); // Staggered by 60ms to prevent lag spikes
                }
            });
        }

        // DOM Elements
        const pageOne = document.getElementById('page-one');
        const pageTwo = document.getElementById('page-two');
        const pageThree = document.getElementById('page-three');
        const cakeBtn = document.getElementById('cakeBtn');
        const messageBox = document.getElementById('message-box');
        const hint = document.querySelector('.hint');
        const msgEl = document.getElementById('msg');
        const sigEl = document.getElementById('signature');
        const thankBtn = document.getElementById('thankBtn');

        const theMessage = "To my absolute favorite person in the world, I hope your day is as bright and amazing as you are! I know A/Ls have been super stressful, but take today to just breathe and celebrate YOU. Thank you for being the best friend a girl could ask for. Here's to surviving these exams and making a million more cute memories! 🌸✨";
        let i = 0;
        let isTyping = false;

        function typeWriter() {
            if (i < theMessage.length) {
                msgEl.innerHTML += theMessage.charAt(i);
                i++;
                setTimeout(typeWriter, 35); 
            } else {
                sigEl.style.display = 'block';
                thankBtn.style.display = 'inline-block';
            }
        }

        cakeBtn.addEventListener('click', () => {
            hint.style.display = 'none';
            messageBox.style.display = 'block';
            setTimeout(() => { messageBox.style.opacity = '1'; }, 100);

            if (!isTyping) {
                isTyping = true;
                typeWriter();
            }

            cornerBurst();

            // PERFORMANCE FIX: Optimized Confetti Loop
            // Replaced every-frame firing with intervals to save 75% CPU load
            let end = Date.now() + 3000;
            
            let confettiShooter = setInterval(function() {
                if (Date.now() > end) {
                    return clearInterval(confettiShooter);
                }
                confetti({
                    particleCount: 15,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff5e7e', '#ffafbd', '#ffffff', '#ffd700']
                });
                confetti({
                    particleCount: 15,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff5e7e', '#ffafbd', '#ffffff', '#ffd700']
                });
            }, 150); 
        });

        // THE EXAM HYPE SWITCH
        thankBtn.addEventListener('click', () => {
            pageOne.style.opacity = '0';
            
            setTimeout(() => {
                pageOne.style.display = 'none';
                
                // TRIGGER EXAM MODE CSS
                document.body.classList.add('exam-mode');
                
                // Properly clear the first background effect
                clearInterval(petalInterval);
                document.querySelectorAll('.petal, .glitter').forEach(el => el.remove());
                
                // Start Exam Hype Drop
                examDropInterval = setInterval(createExamDrop, 450);

                // Sequence Logic
                pageTwo.style.display = 'block';
                
                // Small delay to ensure display:block applies before opacity transition
                requestAnimationFrame(() => {
                    pageTwo.style.opacity = '1';
                });

                setTimeout(() => {
                    pageTwo.style.opacity = '0';
                    
                    setTimeout(() => {
                        pageTwo.style.display = 'none';
                        pageThree.style.display = 'block';
                        
                        requestAnimationFrame(() => {
                            pageThree.style.opacity = '1';
                        });
                        
                    }, 500); 
                }, 4500); 
            }, 500);
        });
    </script>
</body>
</html>
